name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install chromium
      - run: python run_tests.py --coverage
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml
      - run: python -m coverage combine
      - run: python -m coverage report --fail-under=55
      - run: python -m pip install pip-audit bandit
      - run: python -m pip_audit -r requirements.lock --strict
      - run: python -m bandit -r core adapters db scripts -lll
      - run: python scripts/acceptance_matrix.py
      - run: python scripts/verify_distribution.py --skip-demo
      - run: python tests/test_local_demo.py

  package-smoke:
    runs-on: windows-latest
    needs: offline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m playwright install chromium
      - run: crosscheck doctor
      - run: crosscheck demo --workspace ${{ runner.temp }}\crosscheck-demo

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crosscheck-agent"
version = "0.3.0"
description = "Agentic UI/API/DB testing and cross-layer verification platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "playwright>=1.40,<2",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.0,<9",
  "coverage>=7.0,<8",
  "pip-audit>=2.7,<3",
  "bandit>=1.7,<2",
  "defusedxml>=0.7,<1",
]
mcp = [
  "mcp>=1.0,<2",
]

[project.scripts]
crosscheck = "crosscheck_cli:main"

[tool.setuptools]
py-modules = [
  "crosscheck_cli", "run", "run_batch", "run_bootstrap", "run_crosscheck",
  "run_onboard", "run_preflight", "run_record", "run_suite", "run_tests", "run_verify",
]

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "db*", "scripts*", "crosscheck_templates*", "crosscheck_mcp*"]

[tool.setuptools.package-data]
crosscheck_templates = ["*.yaml"]

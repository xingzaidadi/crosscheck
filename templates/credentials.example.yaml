# 复制到 <workspace>/config/credentials.yaml 填真实账号。credentials.yaml 不提交(见 .gitignore)。
# 账号明文只在这里,绝不入知识库 / profile —— profile 里只按 value_from 引字段名。
#
# 只有 login.mode=credential(B 模式,声明式自动登录)的站点才需要在这里配账号。
# mode=manual(A 模式,人工登一次)不需要账号,可不配。

sites:
  # 示例:某个简单账密页的站点用 credential 模式,这里配账号。
  demo:
    username: "autotest_a"
    password: "********"
    tenant_id: 1          # 多出来的字段也可被 steps 的 value_from 引用
